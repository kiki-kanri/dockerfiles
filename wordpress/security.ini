; WordPress PHP 8.5 security defaults.
; Downstream images can override these in conf.d/zz-custom.ini.
; These settings do not replace PHP security updates.

; Avoid disclosing PHP versions, internal errors or exception arguments.
; Leave error_log unset to preserve the SAPI/container logging destination.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = On

; Disable PHP's native session upload-progress tracking, not file uploads.
; Re-enabling requires startup configuration and restarting FPM workers.
; https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
session.upload_progress.enabled = Off

; Harden native PHP sessions. Framework-managed sessions, including Laravel's,
; need their own equivalent application settings.
; https://www.php.net/manual/en/session.security.ini.php
session.use_strict_mode = On
session.use_only_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On

; Set Secure and SameSite cookie policies downstream according to HTTPS and
; authentication requirements; they are intentionally not forced here.

; Do not permit include/require to execute remote URLs. Keep ordinary HTTP requests working.
allow_url_include = Off
