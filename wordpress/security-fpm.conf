; Security defaults for the official image's default pool.
; Apply equivalent settings to any additional pools created downstream.
; Downstream images can override these in php-fpm.d/zz-app.conf.
; https://www.php.net/manual/en/install.fpm.configuration.php
[www]

; Only allow .php files as the main FastCGI script. This does not restrict
; uploaded file types or files included by an executing PHP script.
security.limit_extensions = .php

; Retain non-dumpable workers and prevent worker core dumps containing secrets.
process.dumpable = no
rlimit_core = 0
